<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>SpecRecs My PC</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Monoton&display=swap" rel="stylesheet">
</head>
<body>
  <header>
    <h1><a href="./" title="Back to your answers">SpecRecs</a></h1>
    <p class="tagline">Tell us what's in your PC.</p>
    <div id="summary" class="summary" aria-live="polite"></div>
  </header>
  <main id="categories"></main>
  <footer>
    GPU, CPU and storage data from <a href="https://www.techpowerup.com/database-licensing/" target="_blank" rel="noopener">TechPowerUp</a>,
    with offline GPU data from <a href="https://gpuark.com/" target="_blank" rel="noopener">GPU Ark</a> (CC BY 4.0).
    CPU, storage, RAM, motherboard and PSU data from <a href="https://github.com/docyx/pc-part-dataset" target="_blank" rel="noopener">docyx/pc-part-dataset</a> (MIT).
    Render scores from <a href="https://opendata.blender.org/" target="_blank" rel="noopener">Blender Open Data</a> (public domain).
  </footer>
  <script type="module" src="/src/build/main.ts"></script>
</body>
</html>
